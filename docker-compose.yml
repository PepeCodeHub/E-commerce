x-healthcheck:
  rabbitmq-healthcheck: &rabbitmq-healthcheck
    test: ["CMD", "rabbitmqctl", "status"]
    interval: 30s
    timeout: 10s
    retries: 3

  mongodb-healthcheck: &mongodb-healthcheck
    test: ["CMD","mongosh", "--eval", "db.adminCommand('ping')"]
    interval: 5s
    timeout: 5s
    retries: 3
    start_period: 5s

  postgresql-healthcheck: &postgresql-healthcheck
    test: ["CMD", "pg_isready"]
    interval: 30s
    timeout: 10s
    retries: 3

  redis-healthcheck: &redis-healthcheck
    test: ["CMD", "redis-cli", "ping"]
    interval: 30s
    timeout: 10s
    retries: 3

  gateway-healthcheck: &gateway-healthcheck
    test: curl -f http://localhost:${GATEWAY_PORT}/health || exit 1 
    interval: 5s
    timeout: 5s
    retries: 3

  auth-service-healthcheck: &auth-service-healthcheck
    test: ["CMD", "/usr/local/bin/healthcheck.sh"]
    interval: 30s
    timeout: 10s
    retries: 3

services:
  rabbitmq:
    image: f3an/rabbitmq-docker
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - e-commerce-network
    healthcheck:
      <<: *rabbitmq-healthcheck

  mongodb:
    image: f3an/mongo-docker-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      DB_USERNAME: ${DB_USERNAME}
      DB_USER_PASSWORD: ${DB_USER_PASSWORD}
      DB_NAME: ${DB_NAME}
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - e-commerce-network
    healthcheck:
      <<: *mongodb-healthcheck

  postgresql:
    image: f3an/postgresql-docker-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - e-commerce-network
    healthcheck:
      <<: *postgresql-healthcheck

  redis:
    image: f3an/redis-docker
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - e-commerce-network
    healthcheck:
      <<: *redis-healthcheck
  
  gateway:
    image: gateway:latest
    build:
      context: ./Api/gateway
    environment:
      PORT: ${GATEWAY_PORT}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      API_KEY: ${API_KEY}
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    networks:
      - e-commerce-network
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      <<: *gateway-healthcheck
    
  auth-service:
    image: auth-service:latest
    build:
      context: ./Api/services/auth-service
    environment:
      PG_DB_NAME: ${POSTGRES_DB}
      PG_DB_USER: ${POSTGRES_USER}
      PG_DB_PASSWORD: ${POSTGRES_PASSWORD}
      PG_DB_HOST: postgresql
      PG_ADMIN_EMAIL: ${PG_ADMIN_EMAIL}
      PG_ADMIN_PASSWORD: ${PG_ADMIN_PASSWORD}
      MONGO_DB_URL: mongodb://${DB_USERNAME}:${DB_USER_PASSWORD}@mongodb:27017/${DB_NAME}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
    networks:
      - e-commerce-network
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      <<: *auth-service-healthcheck

volumes:
  rabbitmq-data:
  mongo_data:
  pgdata:
  redis-data:

networks:
  e-commerce-network:
    driver: bridge
